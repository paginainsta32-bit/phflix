<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Final Fix</title>
    <style>
        :root { --red: #e50914; --bg: #000; }
        body { background: var(--bg); color: white; font-family: Arial; margin: 0; }
        
        /* UI Estilo Netflix */
        header { padding: 20px 50px; background: #000; display: flex; justify-content: space-between; position: fixed; width: 100%; z-index: 100; }
        .row { display: flex; overflow-x: auto; padding: 100px 50px 20px; gap: 15px; }
        .card { min-width: 180px; cursor: pointer; border-radius: 4px; transition: 0.3s; }
        .card:hover { transform: scale(1.1); outline: 2px solid white; }
        .card img { width: 100%; height: 260px; object-fit: cover; }

        /* PLAYER FULLSCREEN QUE IGNORA TUDO */
        #player-screen { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: #000; z-index: 9999; 
        }
        .controls { 
            position: absolute; top: 0; left: 0; width: 100%; 
            padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex; align-items: center; z-index: 10001;
        }
        .btn-back { background: var(--red); color: white; border: none; padding: 10px 25px; cursor: pointer; font-weight: bold; border-radius: 4px; }
        
        /* O IFRAME COM PERMISSÕES MÁXIMAS */
        #external-video { 
            width: 100%; height: 100%; border: none; 
            background: #000;
        }
    </style>
</head>
<body>

<header>
    <div style="font-size: 24px; color: var(--red); font-weight: bold;">PHFLIX</div>
</header>

<div id="home">
    <div id="grid" class="row"></div>
</div>

<div id="player-screen">
    <div class="controls">
        <button class="btn-back" onclick="fecharPlayer()">← VOLTAR PARA GALERIA</button>
        <span style="margin-left: 20px;" id="playing-now"></span>
    </div>
    <iframe id="external-video" 
            sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation" 
            allowfullscreen 
            allow="autoplay; encrypted-media">
    </iframe>
</div>

<script>
    const TOKEN = 'KFB2YupQfqQZj6kFDwO6NKaje07vd6DP';
    const IP = 'http://213.199.56.115';
    const PROXY = 'https://cors-anywhere.herokuapp.com/';
    const TBL = 1186;

    async function carregar() {
        const url = `${IP}/api/database/rows/table/${TBL}/?user_field_names=true`;
        const r = await fetch(PROXY + url, { headers: { 'Authorization': `Token ${TOKEN}` } });
        const data = await r.json();
        
        const grid = document.getElementById('grid');
        data.results.forEach(item => {
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `<img src="${item.Capa}">`;
            div.onclick = () => abrirPlayer(item.Nome, item.Link);
            grid.appendChild(div);
        });
    }

    function abrirPlayer(nome, link) {
        if(!link) return alert("Link vazio!");
        
        document.getElementById('playing-now').innerText = "Assistindo: " + nome;
        document.getElementById('home').style.display = 'none';
        document.getElementById('player-screen').style.display = 'block';
        
        // TENTATIVA DE CARREGAMENTO
        const frame = document.getElementById('external-video');
        frame.src = link;

        // Se o player for daqueles que bloqueia iframe, o navegador vai mostrar o erro de conexão.
    }

    function fecharPlayer() {
        document.getElementById('home').style.display = 'flex';
        document.getElementById('player-screen').style.display = 'none';
        document.getElementById('external-video').src = '';
    }

    carregar();
</script>
</body>
</html>
