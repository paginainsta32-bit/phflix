<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Galeria Digital</title>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* HEADER */
        header { 
            padding: 15px 50px; background: rgba(0,0,0,0.95); 
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
        }
        .search-box input { 
            background: #222; border: 1px solid #444; color: white; padding: 8px 15px; 
            border-radius: 20px; outline: none; width: 250px;
        }

        /* PAGINAÇÃO */
        #main-ui { display: block; }
        #player-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        .btn-exit-player { 
            position: absolute; top: 20px; left: 20px; z-index: 10000;
            background: var(--red); color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;
        }

        /* GRID E CARDS */
        #home-page { padding-top: 70px; }
        .hero { height: 50vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 50px; background-image: linear-gradient(to top, var(--bg), transparent); margin-bottom: 20px; }
        .row-title { margin: 30px 0 10px 50px; font-size: 22px; font-weight: bold; }
        .row { display: flex; overflow-x: auto; padding: 0 50px 30px; gap: 15px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }
        .card { min-width: 180px; max-width: 180px; transition: 0.3s; cursor: pointer; background: var(--card-bg); border-radius: 4px; overflow: hidden; }
        .card:hover { transform: scale(1.1); z-index: 10; outline: 2px solid white; }
        .card img { width: 100%; height: 260px; object-fit: cover; }

        /* DETALHES */
        #details-page { display: none; padding: 120px 50px; min-height: 100vh; }
        .details-poster { width: 280px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 0 20px #000; }
        .btn-play { padding: 15px 45px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; margin: 20px 0; }

        /* EPISODIOS */
        .ep-section { margin-top: 30px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .ep-card { background: #222; padding: 15px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; }
        .ep-card:hover { background: var(--red); border-color: white; }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="main-ui">
    <header>
        <div style="font-size: 24px; font-weight: bold; color: var(--red); cursor: pointer;" onclick="showHome()">PHFLIX</div>
        <div class="search-box"><input type="text" id="search-input" placeholder="O que vamos assistir?" oninput="filtrarBusca()"></div>
    </header>

    <div id="home-page">
        <div id="hero" class="hero"><h1 id="hero-title"></h1></div>
        <div id="rows-area"></div>
    </div>

    <div id="details-page">
        <div style="color: var(--red); cursor: pointer; font-weight: bold; margin-bottom: 20px;" onclick="showHome()">← VOLTAR</div>
        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            <img id="det-img" class="details-poster">
            <div style="flex: 1; min-width: 300px;">
                <h2 id="det-name" style="font-size: 45px; margin: 0;"></h2>
                <p id="det-sinopse" style="font-size: 18px; color: #ccc; line-height: 1.6;"></p>
                <div id="main-action"></div>
            </div>
        </div>
        <div id="ep-area" class="ep-section" style="display:none">
            <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">Episódios</h3>
            <div id="ep-grid" class="ep-grid"></div>
        </div>
    </div>
</div>

<div id="player-ui">
    <button class="btn-exit-player" onclick="stopPlayer()">← SAIR DO PLAYER</button>
    <iframe id="fullscreen-iframe" allowfullscreen allow="autoplay"></iframe>
</div>

<script>
    let db = { banners: [], conteudos: [], episodios: [] };
    let filteredList = [];

    async function init() {
        try {
            // Busca o JSON local (GitHub hospeda ambos, então o link é relativo)
            const response = await fetch('dados.json');
            db = await response.json();

            // Configura Banner
            if(db.banners.length) {
                document.getElementById('hero').style.backgroundImage = `linear-gradient(to top, #0a0a0a, transparent), url('${db.banners[0].Imagem}')`;
                document.getElementById('hero-title').innerText = db.banners[0].Nome;
            }

            renderHome(db.conteudos);
        } catch (e) {
            console.error("Erro ao carregar dados.json:", e);
            document.getElementById('hero-title').innerText = "Erro ao carregar banco de dados.";
        }
    }

    function renderHome(lista) {
        const area = document.getElementById('rows-area');
        area.innerHTML = "";
        const cats = {};
        
        lista.forEach(i => {
            const cArr = (i.Categoria || "Geral").split(',');
            cArr.forEach(c => {
                const name = c.trim();
                if(!cats[name]) cats[name] = [];
                cats[name].push(i);
            });
        });

        for(let c in cats) {
            const section = document.createElement('div');
            section.innerHTML = `
                <div class="row-title">${c}</div>
                <div class="row">
                    ${cats[c].map(item => `
                        <div class="card" onclick='showDetails(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                            <img src="${item.Capa}">
                        </div>`).join('')}
                </div>`;
            area.appendChild(section);
        }
    }

    function showDetails(item) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        window.scrollTo(0,0);

        document.getElementById('det-img').src = item.Capa;
        document.getElementById('det-name').innerText = item.Nome;
        document.getElementById('det-sinopse').innerText = item.Sinopse || "";

        const action = document.getElementById('main-action');
        const epArea = document.getElementById('ep-area');
        
        if(item.Tipo === "Filme") {
            action.innerHTML = `<button class="btn-play" onclick="startPlayer('${item.Link}')">▶ ASSISTIR AGORA</button>`;
            epArea.style.display = 'none';
        } else {
            action.innerHTML = "<p style='color:var(--red); font-weight:bold;'>Escolha um episódio abaixo:</p>";
            epArea.style.display = 'block';
            
            const eps = db.episodios.filter(e => e.Nome.trim().toLowerCase() === item.Nome.trim().toLowerCase());
            document.getElementById('ep-grid').innerHTML = eps.sort((a,b) => a.Episódio - b.Episódio).map(e => `
                <div class="ep-card" onclick="startPlayer('${e.Link}')">
                    <strong>Episódio ${e.Episódio}</strong><br><small>Temporada ${e.Temporada}</small>
                </div>
            `).join('');
        }
    }

    function startPlayer(url) {
        if(!url) return alert("Link de vídeo não disponível.");
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('player-ui').style.display = 'block';
        document.getElementById('fullscreen-iframe').src = url;
    }

    function stopPlayer() {
        document.getElementById('main-ui').style.display = 'block';
        document.getElementById('player-ui').style.display = 'none';
        document.getElementById('fullscreen-iframe').src = '';
    }

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('details-page').style.display = 'none';
    }

    function filtrarBusca() {
        const t = document.getElementById('search-input').value.toLowerCase();
        const filtrados = db.conteudos.filter(i => i.Nome.toLowerCase().includes(t) || i.Categoria.toLowerCase().includes(t));
        renderHome(filtrados);
    }

    init();
</script>
</body>
</html>
