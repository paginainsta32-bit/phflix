<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Full Experience</title>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Arial', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* HEADER */
        header { 
            padding: 15px 50px; background: rgba(0,0,0,0.9); 
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
        }
        .search-box input { background: #222; border: 1px solid #444; color: white; padding: 8px 15px; border-radius: 20px; outline: none; }

        /* PAGINAÇÃO */
        #main-ui { display: block; }
        #player-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        
        /* BOTÃO VOLTAR FLUTUANTE (DENTRO DO PLAYER) */
        .btn-exit-player { 
            position: absolute; top: 20px; left: 20px; z-index: 10000;
            background: rgba(229, 9, 20, 0.8); color: white; border: none;
            padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .btn-exit-player:hover { background: var(--red); }

        /* GRID E CARDS */
        #home-page { padding-top: 80px; }
        .row-title { margin: 30px 0 10px 50px; font-size: 22px; font-weight: bold; }
        .row { display: flex; overflow-x: auto; padding: 0 50px 30px; gap: 15px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }
        .card { min-width: 180px; transition: 0.3s; cursor: pointer; background: var(--card-bg); border-radius: 4px; }
        .card:hover { transform: scale(1.1); outline: 2px solid white; }
        .card img { width: 100%; height: 260px; object-fit: cover; }

        /* DETALHES */
        #details-page { display: none; padding: 100px 50px; }
        .details-poster { width: 250px; border-radius: 8px; margin-bottom: 20px; }
        .btn-play { padding: 15px 40px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }

        /* EPISODIOS */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 20px; }
        .ep-card { background: #222; padding: 15px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; }
        
        iframe#fullscreen-iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="main-ui">
    <header>
        <div style="font-size: 24px; font-weight: bold; color: var(--red); cursor: pointer;" onclick="showHome()">PHFLIX</div>
        <div class="search-box"><input type="text" id="search-input" placeholder="Pesquisar..." oninput="filtrarBusca()"></div>
    </header>

    <div id="home-page">
        <div id="rows-area"></div>
    </div>

    <div id="details-page">
        <div style="color: var(--red); cursor: pointer; margin-bottom: 20px;" onclick="showHome()">← VOLTAR</div>
        <img id="det-img" class="details-poster">
        <h2 id="det-name"></h2>
        <p id="det-sinopse"></p>
        <div id="main-action"></div>
        <div id="ep-area" style="display:none">
            <h3>Episódios</h3>
            <div id="ep-grid" class="ep-grid"></div>
        </div>
    </div>
</div>

<div id="player-ui">
    <button class="btn-exit-player" onclick="stopPlayer()">← SAIR DO PLAYER</button>
    <iframe id="fullscreen-iframe" allowfullscreen allow="autoplay"></iframe>
</div>

<script>
    const TOKEN = 'KFB2YupQfqQZj6kFDwO6NKaje07vd6DP';
    const IP = 'http://213.199.56.115';
    const PROXY = 'https://cors-anywhere.herokuapp.com/'; 
    const TBL = { CONTENT: 1186, BANNER: 1189, EPS: 1191 };
    let todosConteudos = [];

    async function api(id) {
        const url = `${IP}/api/database/rows/table/${id}/?user_field_names=true`;
        const r = await fetch(PROXY + url, { headers: { 'Authorization': `Token ${TOKEN}` } });
        return await r.json();
    }

    async function init() {
        const data = await api(TBL.CONTENT);
        todosConteudos = data.results;
        renderHome(todosConteudos);
    }

    function renderHome(lista) {
        const area = document.getElementById('rows-area');
        area.innerHTML = "";
        const cats = {};
        lista.forEach(i => {
            const cArr = (i.Categoria || "Geral").split(',');
            cArr.forEach(c => { if(!cats[c.trim()]) cats[c.trim()] = []; cats[c.trim()].push(i); });
        });
        for(let c in cats) {
            area.innerHTML += `<div class="row-title">${c}</div><div class="row">${cats[c].map(i => `
                <div class="card" onclick='showDetails(${JSON.stringify(i).replace(/'/g, "&apos;")})'>
                    <img src="${i.Capa}">
                </div>`).join('')}</div>`;
        }
    }

    function showDetails(item) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        document.getElementById('det-img').src = item.Capa;
        document.getElementById('det-name').innerText = item.Nome;
        document.getElementById('det-sinopse').innerText = item.Sinopse || "";
        
        const action = document.getElementById('main-action');
        const epArea = document.getElementById('ep-area');
        
        if(item.Tipo === "Filme") {
            action.innerHTML = `<button class="btn-play" onclick="startPlayer('${item.Link}')">ASSISTIR FILME</button>`;
            epArea.style.display = 'none';
        } else {
            action.innerHTML = "";
            epArea.style.display = 'block';
            loadEps(item.Nome);
        }
    }

    async function loadEps(nome) {
        const d = await api(TBL.EPS);
        const filtrados = d.results.filter(e => e.Nome.trim().toLowerCase() === nome.trim().toLowerCase());
        document.getElementById('ep-grid').innerHTML = filtrados.map(e => `
            <div class="ep-card" onclick="startPlayer('${e.Link}')">Episódio ${e.Episódio}</div>
        `).join('');
    }

    // AQUI ESTÁ O SEGREDO: Alterna entre a interface e o player
    function startPlayer(url) {
        if(!url) return alert("Link inválido");
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('player-ui').style.display = 'block';
        document.getElementById('fullscreen-iframe').src = url;
    }

    function stopPlayer() {
        document.getElementById('main-ui').style.display = 'block';
        document.getElementById('player-ui').style.display = 'none';
        document.getElementById('fullscreen-iframe').src = '';
    }

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('details-page').style.display = 'none';
    }

    function filtrarBusca() {
        const t = document.getElementById('search-input').value.toLowerCase();
        renderHome(todosConteudos.filter(i => i.Nome.toLowerCase().includes(t)));
    }

    init();
</script>
</body>
</html>
