<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Pro Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; }
        
        /* HEADER */
        header { 
            padding: 15px 50px; background: rgba(0,0,0,0.95); 
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
        }

        /* UI PRINCIPAL */
        #main-wrapper { height: 100vh; overflow-y: auto; padding-top: 80px; }
        
        /* TELA DO PLAYER (OVERLAY) */
        #player-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: #000; z-index: 9999; 
        }

        /* BOTÃO VOLTAR GIGANTE */
        .btn-close-video { 
            position: absolute; top: 20px; left: 20px; z-index: 10000;
            background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid rgba(255,255,255,0.3);
            padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        .btn-close-video:hover { background: var(--red); border-color: var(--red); }

        /* GRID ESTILO NETFLIX */
        .row-title { margin: 20px 50px 10px; font-size: 22px; font-weight: bold; }
        .row { display: flex; overflow-x: auto; padding: 0 50px 30px; gap: 15px; scrollbar-width: none; }
        .card { min-width: 170px; cursor: pointer; transition: 0.3s; border-radius: 4px; overflow: hidden; background: var(--card-bg); }
        .card:hover { transform: scale(1.1); z-index: 10; outline: 2px solid white; }
        .card img { width: 100%; height: 250px; object-fit: cover; }

        /* DETALHES */
        #details-page { display: none; padding: 50px; }
        .btn-play { padding: 15px 45px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<div id="main-wrapper">
    <header>
        <div style="font-size: 26px; font-weight: bold; color: var(--red); cursor: pointer;" onclick="showHome()">PHFLIX</div>
    </header>

    <div id="home-page">
        <div id="rows-area"></div>
    </div>

    <div id="details-page">
        <div style="color: var(--red); cursor: pointer; font-weight: bold; margin-bottom: 30px;" onclick="showHome()">← VOLTAR</div>
        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            <img id="det-img" style="width: 280px; border-radius: 8px;">
            <div style="flex: 1;">
                <h2 id="det-name" style="font-size: 45px; margin: 0;"></h2>
                <p id="det-sinopse" style="font-size: 18px; color: #ccc; line-height: 1.6;"></p>
                <div id="main-action"></div>
                <div id="ep-area" style="display:none; margin-top: 30px;">
                    <h3>Episódios</h3>
                    <div id="ep-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="player-overlay">
    <button class="btn-close-video" onclick="closePlayer()">✕ SAIR DO PLAYER</button>
    <iframe id="video-frame" allowfullscreen sandbox="allow-forms allow-scripts allow-same-origin allow-top-navigation"></iframe>
</div>

<script>
    let conteudos = [];
    let episodios = [];

    function carregarCSV(arquivo) {
        return new Promise((resolve) => {
            Papa.parse(arquivo, { download: true, header: true, skipEmptyLines: true, complete: (r) => resolve(r.data), error: () => resolve([]) });
        });
    }

    async function init() {
        const [dCont, dEps] = await Promise.all([carregarCSV('conteudos.csv'), carregarCSV('episodios.csv')]);
        conteudos = dCont; episodios = dEps;
        renderHome(conteudos);
    }

    function renderHome(lista) {
        const area = document.getElementById('rows-area');
        area.innerHTML = "";
        const cats = {};
        lista.forEach(i => {
            const cat = (i.Categoria || i.categoria || "Geral").split(',')[0].trim();
            if(!cats[cat]) cats[cat] = [];
            cats[cat].push(i);
        });
        for(let c in cats) {
            area.innerHTML += `<div class="row-title">${c}</div><div class="row">${cats[c].map(item => `
                <div class="card" onclick='showDetails(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                    <img src="${item.Capa || item.capa}">
                </div>`).join('')}</div>`;
        }
    }

    function showDetails(item) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        const nome = item.Nome || item.nome;
        const link = item.Link || item.link || item.URL || item.url;
        document.getElementById('det-img').src = item.Capa || item.capa;
        document.getElementById('det-name').innerText = nome;
        document.getElementById('det-sinopse').innerText = item.Sinopse || item.sinopse || "";

        const action = document.getElementById('main-action');
        const epArea = document.getElementById('ep-area');

        if((item.Tipo || item.tipo) === "Filme") {
            action.innerHTML = `<button class="btn-play" onclick="openPlayer('${link}')">▶ ASSISTIR AGORA</button>`;
            epArea.style.display = 'none';
        } else {
            action.innerHTML = ""; epArea.style.display = 'block';
            const eps = episodios.filter(e => (e.Nome || e.nome || "").trim().toLowerCase() === nome.trim().toLowerCase());
            document.getElementById('ep-grid').innerHTML = eps.map(e => `
                <div style="background:#222; padding:15px; border-radius:4px; text-align:center; cursor:pointer;" onclick="openPlayer('${e.Link || e.link}')">Ep ${e.Episódio || e.episodio}</div>
            `).join('');
        }
    }

    // TÉCNICA DO OVERLAY: Mantém o site por baixo e o player por cima
    function openPlayer(url) {
        if(!url || url === "undefined") return alert("Link não encontrado!");
        
        const overlay = document.getElementById('player-overlay');
        const frame = document.getElementById('video-frame');
        
        overlay.style.display = 'block';
        frame.src = url;
    }

    function closePlayer() {
        const overlay = document.getElementById('player-overlay');
        const frame = document.getElementById('video-frame');
        
        overlay.style.display = 'none';
        frame.src = ''; // Mata o vídeo ao sair
    }

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('details-page').style.display = 'none';
    }

    init();
</script>
</body>
</html>
