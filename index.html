<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Power CSV Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow-x: hidden; }
        
        /* HEADER */
        header { 
            padding: 15px 50px; background: rgba(0,0,0,0.95); 
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid #222;
        }
        .search-box input { 
            background: #222; border: 1px solid #444; color: white; padding: 10px 20px; 
            border-radius: 25px; outline: none; width: 280px; transition: 0.3s;
        }
        .search-box input:focus { width: 350px; border-color: var(--red); }

        /* UI PRINCIPAL */
        #main-ui { display: block; padding-top: 80px; }
        #player-ui { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; }
        .btn-exit-player { 
            position: absolute; top: 25px; left: 25px; z-index: 10000;
            background: var(--red); color: white; border: none; padding: 12px 25px; 
            cursor: pointer; font-weight: bold; border-radius: 4px; box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* HOME / GRID */
        .hero { height: 50vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 50px; background-image: linear-gradient(to top, var(--bg), transparent); margin-bottom: 20px; }
        .hero h1 { font-size: 45px; margin: 0; text-shadow: 2px 2px 10px #000; }
        
        .row-title { margin: 30px 0 10px 50px; font-size: 22px; font-weight: bold; color: #fff; }
        .row { display: flex; overflow-x: auto; padding: 0 50px 30px; gap: 15px; scrollbar-width: none; }
        .row::-webkit-scrollbar { display: none; }

        .card { min-width: 170px; max-width: 170px; transition: 0.3s; cursor: pointer; background: var(--card-bg); border-radius: 4px; overflow: hidden; position: relative; }
        .card:hover { transform: scale(1.1); z-index: 10; outline: 3px solid white; }
        .card img { width: 100%; height: 250px; object-fit: cover; display: block; }

        /* DETALHES */
        #details-page { display: none; padding: 120px 50px 50px; min-height: 100vh; }
        .back-btn { cursor: pointer; color: var(--red); font-weight: bold; margin-bottom: 30px; display: inline-block; font-size: 18px; }
        .details-flex { display: flex; gap: 50px; flex-wrap: wrap; }
        .details-poster { width: 300px; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        .details-info { flex: 1; min-width: 300px; }
        .details-info h2 { font-size: 50px; margin: 0 0 15px 0; }
        .details-info p { font-size: 18px; color: #ccc; line-height: 1.6; max-width: 800px; }

        .btn-play { padding: 18px 50px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; margin-top: 25px; transition: 0.2s; }
        .btn-play:hover { background: #e6e6e6; transform: scale(1.05); }

        /* EPISODIOS */
        .ep-section { margin-top: 50px; background: #111; padding: 30px; border-radius: 8px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .ep-card { background: #222; padding: 20px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; transition: 0.2s; }
        .ep-card:hover { background: var(--red); border-color: white; }

        iframe { width: 100%; height: 100%; border: none; background: #000; }
    </style>
</head>
<body>

<div id="main-ui">
    <header>
        <div style="font-size: 26px; font-weight: bold; color: var(--red); cursor: pointer; letter-spacing: 1px;" onclick="showHome()">PHFLIX</div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="O que você quer assistir?" oninput="filtrar()">
        </div>
    </header>

    <div id="home-page">
        <div id="hero" class="hero"><h1 id="hero-title">Carregando catálogo...</h1></div>
        <div id="rows-area"></div>
    </div>

    <div id="details-page">
        <div class="back-btn" onclick="showHome()">← VOLTAR PARA O INÍCIO</div>
        <div class="details-flex">
            <img id="det-img" class="details-poster">
            <div class="details-info">
                <h2 id="det-name"></h2>
                <p id="det-sinopse"></p>
                <div id="main-action"></div>
                <div id="ep-area" class="ep-section" style="display:none">
                    <h3 style="margin-top:0">Episódios</h3>
                    <div id="ep-grid" class="ep-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="player-ui">
    <button class="btn-exit-player" onclick="stopPlayer()">← SAIR DO PLAYER</button>
    <iframe id="fullscreen-iframe" allowfullscreen allow="autoplay"></iframe>
</div>

<script>
    let conteudos = [];
    let episodios = [];

    // Função Robusta para carregar CSV
    function carregarCSV(arquivo) {
        return new Promise((resolve) => {
            Papa.parse(arquivo, {
                download: true,
                header: true,
                skipEmptyLines: true,
                error: (err) => {
                    console.error("Erro ao carregar " + arquivo, err);
                    resolve([]);
                },
                complete: (results) => resolve(results.data)
            });
        });
    }

    async function init() {
        try {
            // Carrega os 3 arquivos (Garanta que os nomes no GitHub sejam estes)
            const [dataBanners, dataCont, dataEps] = await Promise.all([
                carregarCSV('banners.csv'),
                carregarCSV('conteudos.csv'),
                carregarCSV('episodios.csv')
            ]);

            conteudos = dataCont;
            episodios = dataEps;

            // Configura Banner
            if(dataBanners.length > 0) {
                const banner = dataBanners[0];
                const imgBanner = banner.Imagem || banner.imagem;
                const nomeBanner = banner.Nome || banner.nome;
                document.getElementById('hero').style.backgroundImage = `linear-gradient(to top, #0a0a0a, transparent), url('${imgBanner}')`;
                document.getElementById('hero-title').innerText = nomeBanner;
            } else {
                document.getElementById('hero-title').innerText = "PHFLIX - Pro Search";
            }

            renderHome(conteudos);
        } catch (e) {
            console.error(e);
            document.getElementById('hero-title').innerText = "Erro ao conectar com o banco de dados.";
        }
    }

    function renderHome(lista) {
        const area = document.getElementById('rows-area');
        area.innerHTML = "";
        
        if(lista.length === 0) {
            area.innerHTML = "<p style='margin-left:50px'>Nenhum resultado encontrado.</p>";
            return;
        }

        const cats = {};
        lista.forEach(i => {
            const catField = i.Categoria || i.categoria || "Geral";
            const generos = catField.split(',');
            generos.forEach(g => {
                const nomeCat = g.trim();
                if(!cats[nomeCat]) cats[nomeCat] = [];
                cats[nomeCat].push(i);
            });
        });

        for(let c in cats) {
            const rowDiv = document.createElement('div');
            rowDiv.innerHTML = `
                <div class="row-title">${c}</div>
                <div class="row">
                    ${cats[c].map(item => {
                        const capa = item.Capa || item.capa;
                        const dataStr = JSON.stringify(item).replace(/'/g, "&apos;");
                        return `
                        <div class="card" onclick='showDetails(${dataStr})'>
                            <img src="${capa}" onerror="this.src='https://via.placeholder.com/170x250?text=Sem+Capa'">
                        </div>`;
                    }).join('')}
                </div>`;
            area.appendChild(rowDiv);
        }
    }

    function showDetails(item) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        window.scrollTo(0,0);

        const capa = item.Capa || item.capa;
        const nome = item.Nome || item.nome;
        const sinopse = item.Sinopse || item.sinopse;
        const link = item.Link || item.link;
        const tipo = item.Tipo || item.tipo;

        document.getElementById('det-img').src = capa;
        document.getElementById('det-name').innerText = nome;
        document.getElementById('det-sinopse').innerText = sinopse || "Sem sinopse disponível.";

        const action = document.getElementById('main-action');
        const epArea = document.getElementById('ep-area');

        if(tipo === "Filme") {
            action.innerHTML = `<button class="btn-play" onclick="startPlayer('${link}')">▶ ASSISTIR AGORA</button>`;
            epArea.style.display = 'none';
        } else {
            action.innerHTML = "<p style='color:var(--red); font-weight:bold; margin-top:20px;'>SÉRIE: Escolha o episódio abaixo</p>";
            epArea.style.display = 'block';
            
            // Filtro de episódios
            const epsEncontrados = episodios.filter(e => {
                const nomeEp = e.Nome || e.nome;
                return nomeEp && nomeEp.trim().toLowerCase() === nome.trim().toLowerCase();
            });

            if(epsEncontrados.length === 0) {
                document.getElementById('ep-grid').innerHTML = "<p>Nenhum episódio cadastrado.</p>";
            } else {
                document.getElementById('ep-grid').innerHTML = epsEncontrados.sort((a,b) => {
                    const epA = a.Episódio || a.episodio || 0;
                    const epB = b.Episódio || b.episodio || 0;
                    return epA - epB;
                }).map(e => {
                    const epNum = e.Episódio || e.episodio;
                    const tempNum = e.Temporada || e.temporada;
                    const epLink = e.Link || e.link;
                    return `<div class="ep-card" onclick="startPlayer('${epLink}')">Episódio ${epNum}<br><small>Temporada ${tempNum}</small></div>`;
                }).join('');
            }
        }
    }

    function startPlayer(url) {
        if(!url || url === "undefined" || url === "") {
            alert("Erro: O link do vídeo não foi encontrado no arquivo CSV.");
            return;
        }
        document.getElementById('main-ui').style.display = 'none';
        document.getElementById('player-ui').style.display = 'block';
        
        const iframe = document.getElementById('fullscreen-iframe');
        iframe.src = url;
    }

    function stopPlayer() {
        document.getElementById('main-ui').style.display = 'block';
        document.getElementById('player-ui').style.display = 'none';
        document.getElementById('fullscreen-iframe').src = '';
    }

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('details-page').style.display = 'none';
        window.scrollTo(0,0);
    }

    function filtrar() {
        const termo = document.getElementById('search-input').value.toLowerCase();
        const filtrados = conteudos.filter(i => {
            const n = i.Nome || i.nome || "";
            return n.toLowerCase().includes(termo);
        });
        renderHome(filtrados);
    }

    // Iniciar Catálogo
    init();
</script>
</body>
</html>
