<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>PHFLIX - Temporadas Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --red: #e50914; --bg: #0a0a0a; --card-bg: #181818; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; }
        
        header { 
            padding: 15px 50px; background: rgba(0,0,0,0.95); 
            display: flex; justify-content: space-between; align-items: center;
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
            border-bottom: 1px solid #222;
        }
        .search-box input { background: #222; border: 1px solid #444; color: white; padding: 10px 20px; border-radius: 25px; outline: none; width: 250px; }

        #main-ui { display: block; padding-top: 80px; }
        
        .hero { height: 50vh; background-size: cover; background-position: center; display: flex; align-items: flex-end; padding: 50px; background-image: linear-gradient(to top, var(--bg), transparent); }
        .row-title { margin: 30px 0 10px 50px; font-size: 22px; font-weight: bold; }
        .row { display: flex; overflow-x: auto; padding: 0 50px 30px; gap: 15px; scrollbar-width: none; }
        .card { min-width: 170px; max-width: 170px; transition: 0.3s; cursor: pointer; background: var(--card-bg); border-radius: 4px; overflow: hidden; }
        .card:hover { transform: scale(1.1); z-index: 10; outline: 3px solid white; }
        .card img { width: 100%; height: 250px; object-fit: cover; }

        /* DETALHES */
        #details-page { display: none; padding: 120px 50px 50px; min-height: 100vh; }
        .details-poster { width: 280px; border-radius: 8px; box-shadow: 0 0 20px #000; }
        .btn-play { padding: 15px 45px; background: white; color: black; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 16px; margin-top: 20px; }

        /* SELEÇÃO DE TEMPORADAS */
        .season-selector { display: flex; gap: 10px; margin: 25px 0; overflow-x: auto; padding-bottom: 10px; }
        .btn-season { background: #333; color: white; border: 1px solid #444; padding: 10px 20px; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .btn-season.active { background: var(--red); border-color: var(--red); font-weight: bold; }

        /* EPISODIOS */
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
        .ep-card { background: #222; padding: 20px; border-radius: 4px; cursor: pointer; text-align: center; border: 1px solid #333; }
        .ep-card:hover { background: var(--red); }
    </style>
</head>
<body>

<div id="main-ui">
    <header>
        <div style="font-size: 26px; font-weight: bold; color: var(--red); cursor: pointer;" onclick="showHome()">PHFLIX</div>
        <div class="search-box"><input type="text" id="search-input" placeholder="Buscar..." oninput="filtrar()"></div>
    </header>

    <div id="home-page">
        <div id="hero" class="hero"><h1 id="hero-title">PHFLIX</h1></div>
        <div id="rows-area"></div>
    </div>

    <div id="details-page">
        <div style="color: var(--red); cursor: pointer; font-weight: bold; margin-bottom: 30px;" onclick="showHome()">← VOLTAR</div>
        <div style="display: flex; gap: 40px; flex-wrap: wrap;">
            <img id="det-img" class="details-poster">
            <div style="flex: 1;">
                <h2 id="det-name" style="font-size: 45px; margin: 0;"></h2>
                <p id="det-sinopse" style="font-size: 18px; color: #ccc; line-height: 1.6;"></p>
                <div id="main-action"></div>
                
                <div id="ep-area" style="display:none">
                    <div id="season-buttons" class="season-selector"></div>
                    <div id="ep-grid" class="ep-grid"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let conteudos = [];
    let episodios = [];

    function carregarCSV(arquivo) {
        return new Promise((resolve) => {
            Papa.parse(arquivo, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: (results) => resolve(results.data),
                error: () => resolve([])
            });
        });
    }

    async function init() {
        const [dBanners, dCont, dEps] = await Promise.all([
            carregarCSV('banners.csv'),
            carregarCSV('conteudos.csv'),
            carregarCSV('episodios.csv')
        ]);
        conteudos = dCont;
        episodios = dEps;

        if(dBanners.length) {
            document.getElementById('hero').style.backgroundImage = `linear-gradient(to top, #0a0a0a, transparent), url('${dBanners[0].Imagem || dBanners[0].imagem}')`;
            document.getElementById('hero-title').innerText = dBanners[0].Nome || dBanners[0].nome;
        }
        renderHome(conteudos);
    }

    function renderHome(lista) {
        const area = document.getElementById('rows-area');
        area.innerHTML = "";
        const cats = {};
        lista.forEach(i => {
            const catField = i.Categoria || i.categoria || "Geral";
            catField.split(',').forEach(cat => {
                const n = cat.trim();
                if(!cats[n]) cats[n] = [];
                cats[n].push(i);
            });
        });
        for(let c in cats) {
            area.innerHTML += `<div class="row-title">${c}</div><div class="row">${cats[c].map(item => `
                <div class="card" onclick='showDetails(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                    <img src="${item.Capa || item.capa}">
                </div>`).join('')}</div>`;
        }
    }

    function showDetails(item) {
        document.getElementById('home-page').style.display = 'none';
        document.getElementById('details-page').style.display = 'block';
        window.scrollTo(0,0);
        
        const nome = item.Nome || item.nome;
        const link = item.Link || item.link;
        
        document.getElementById('det-img').src = item.Capa || item.capa;
        document.getElementById('det-name').innerText = nome;
        document.getElementById('det-sinopse').innerText = item.Sinopse || item.sinopse || "";

        const action = document.getElementById('main-action');
        const epArea = document.getElementById('ep-area');

        if((item.Tipo || item.tipo) === "Filme") {
            action.innerHTML = `<button class="btn-play" onclick="startPlayer('${link}')">▶ ASSISTIR FILME</button>`;
            epArea.style.display = 'none';
        } else {
            action.innerHTML = "";
            epArea.style.display = 'block';
            
            // 1. Filtrar todos os episódios desta série
            const epsSérie = episodios.filter(e => (e.Nome || e.nome || "").trim().toLowerCase() === nome.trim().toLowerCase());
            
            // 2. Descobrir quais temporadas existem
            const temporadasUnicas = [...new Set(epsSérie.map(e => e.Temporada || e.temporada))].sort((a,b) => a-b);
            
            // 3. Criar os botões de temporadas
            const btnArea = document.getElementById('season-buttons');
            btnArea.innerHTML = temporadasUnicas.map(t => `
                <button class="btn-season" id="btn-t-${t}" onclick="filtrarTemporada('${nome}', ${t})">Temporada ${t}</button>
            `).join('');

            // 4. Mostrar a primeira temporada por padrão
            if(temporadasUnicas.length > 0) {
                filtrarTemporada(nome, temporadasUnicas[0]);
            }
        }
    }

    function filtrarTemporada(nomeSerie, numTemporada) {
        // Estilo dos botões
        document.querySelectorAll('.btn-season').forEach(b => b.classList.remove('active'));
        const btnAtivo = document.getElementById(`btn-t-${numTemporada}`);
        if(btnAtivo) btnAtivo.classList.add('active');

        // Filtrar episódios
        const grid = document.getElementById('ep-grid');
        const epsFiltrados = episodios.filter(e => 
            (e.Nome || e.nome || "").trim().toLowerCase() === nomeSerie.trim().toLowerCase() && 
            (e.Temporada || e.temporada) == numTemporada
        ).sort((a,b) => (a.Episódio || a.episodio) - (b.Episódio || b.episodio));

        grid.innerHTML = epsFiltrados.map(e => `
            <div class="ep-card" onclick="startPlayer('${e.Link || e.link}')">
                Episódio ${e.Episódio || e.episodio}
            </div>
        `).join('');
    }

    function startPlayer(url) {
        if(!url || url === "undefined" || url === "") return alert("Link não encontrado!");
        window.location.href = url;
    }

    function showHome() {
        document.getElementById('home-page').style.display = 'block';
        document.getElementById('details-page').style.display = 'none';
        window.scrollTo(0,0);
    }

    function filtrar() {
        const t = document.getElementById('search-input').value.toLowerCase();
        renderHome(conteudos.filter(i => (i.Nome || i.nome || "").toLowerCase().includes(t)));
    }

    init();
</script>
</body>
</html>
